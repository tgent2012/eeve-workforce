<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EEVE AI — The Enterprise Workforce Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFFFF] text-[#111111] selection:bg-[#A31D1D]/10 selection:text-[#A31D1D] relative min-h-screen overflow-x-hidden">
    <!-- Global Interactive Reveal Background Layer -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
      <div class="bg-layer layer-sharp"></div>
      <div class="bg-layer layer-mist"></div>
      <div class="noise-overlay"></div>
    </div>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script type="text/javascript">
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      let currentX = mouseX;
      let currentY = mouseY;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animate() {
        currentX += (mouseX - currentX) * 0.12;
        currentY += (mouseY - currentY) * 0.12;

        document.documentElement.style.setProperty("--cursor-x", currentX + "px");
        document.documentElement.style.setProperty("--cursor-y", currentY + "px");

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
