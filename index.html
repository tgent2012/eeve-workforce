<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EEVE AI — The Enterprise Workforce Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFFFF] text-[#111111] selection:bg-[#A31D1D]/10 selection:text-[#A31D1D] relative min-h-screen overflow-x-hidden">
    <!-- Global Interactive Reveal Background Layer -->
    <div id="interactive-bg" class="fixed inset-0 overflow-hidden pointer-events-none z-0">
      <div class="bg-layer layer-sharp"></div>
      <div class="bg-layer layer-mist"></div>
      <div class="noise-overlay"></div>
    </div>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script type="text/javascript">
      (function() {
        const bgEl = document.getElementById("interactive-bg");
        if (!bgEl) return;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = mouseX;
        let currentY = mouseY;
        let isAnimating = false;

        document.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (!isAnimating) {
            isAnimating = true;
            requestAnimationFrame(animate);
          }
        }, { passive: true });

        function animate() {
          const dx = mouseX - currentX;
          const dy = mouseY - currentY;

          if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) {
            currentX = mouseX;
            currentY = mouseY;
            bgEl.style.setProperty("--cursor-x", currentX + "px");
            bgEl.style.setProperty("--cursor-y", currentY + "px");
            isAnimating = false;
            return;
          }

          currentX += dx * 0.12;
          currentY += dy * 0.12;

          bgEl.style.setProperty("--cursor-x", currentX.toFixed(1) + "px");
          bgEl.style.setProperty("--cursor-y", currentY.toFixed(1) + "px");

          requestAnimationFrame(animate);
        }
      })();
    </script>
  </body>
</html>
